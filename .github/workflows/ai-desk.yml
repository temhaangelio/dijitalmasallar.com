# Drives the AI desk on a schedule.
#
# The work lives in the app (`/api/ai/run`); this only rings the bell. GitHub Actions is used rather
# than Vercel Cron because it is free at this granularity on any plan — swapping to `vercel.json`
# crons later means deleting this file and adding two entries there, with no change to the app.
#
# Two secrets are required on the repository:
#   AI_DESK_URL     https://diji.news   (no trailing slash)
#   CRON_SECRET     the same value the deployment has in its environment
#
# GitHub's scheduler is best-effort and runs late under load; that is fine here, because a news
# desk that checks its sources at :07 instead of :00 has lost nothing.

name: AI desk

on:
  schedule:
    # Collect every 15 minutes: cheap, no model calls.
    - cron: "*/15 * * * *"
    # Summarise on the half hour: this is the job that spends money, and it is capped per run.
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Çalıştırılacak iş"
        type: choice
        options: [collect, summarize]
        default: collect

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger
        env:
          BASE_URL: ${{ secrets.AI_DESK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A manual run uses the chosen job; a scheduled one is decided by which cron fired.
          JOB: ${{ inputs.job || (github.event.schedule == '0,30 * * * *' && 'summarize' || 'collect') }}
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/ai/run?job=$JOB")
          echo "$response"
          echo "### AI desk · $JOB" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$response" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
